# Default values for auscope-portal-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/auscope/auscope-portal-api/auscope-portal-api-prod-release
  # 166401538379.dkr.ecr.ap-southeast-2.amazonaws.com/auscope-portal-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

applicationconfig:
  localCacheDir: /cswcache/

extraPodEnv: |
  - name: spring.config.location
    value: "/workspace/config/application.yaml"
  # Azure App Configuration (Spring Cloud Azure 7.x). Replaces the removed
  # bootstrap.yml mechanism. Set APP_CONFIG_ENABLED=true and provide the
  # connection string (ideally from a Kubernetes/Key Vault secret) to load
  # configuration — including the active Spring profile — from App Configuration.
  - name: APP_CONFIG_ENABLED
    value: "true"
  - name: APP_CONFIGURATION_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: {{ .Values.appConfig.connectionStringSecret.name | default "auscope-portal-api-appconfig" }}
        key: {{ .Values.appConfig.connectionStringSecret.key | default "connection-string" }}
  - name: JAVA_TOOL_OPTIONS
    value: '-XX:InitialRAMPercentage=10 -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80'

# Azure App Configuration connection-string secret reference used by extraPodEnv.
# Override these to point at the Secret that holds the App Config connection string.
appConfig:
  connectionStringSecret:
    name: "auscope-portal-api-appconfig"
    key: "connection-string"

persistence:
  cswcacheDir:
    enabled: true
    existingClaim: false
    mountPath: /cswcache
    subPath: "cswcache"
    size: 2Gi
    storageClass: efs
    accessModes:
      - ReadWriteMany
    annotations: {}
